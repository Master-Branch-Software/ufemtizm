<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" rx="48" fill="#2a2438"/>

  <!-- Three chunky bars from 01c -->
  <rect x="44"  y="40" width="44" height="176" rx="20" fill="#fef3c7"/>
  <rect x="106" y="40" width="44" height="176" rx="20" fill="#fecaca"/>
  <rect x="168" y="40" width="44" height="176" rx="20" fill="#bfdbfe"/>

  <!-- Lavender curve from the original 01, thinner stroke -->
